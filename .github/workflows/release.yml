name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos-latest'
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Mail Escape Hatch ${{ env.RELEASE_TAG }}
          releaseBody: Unsigned desktop builds. Verify the SHA256SUMS file before opening a download.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir release
      - name: Build manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          python3 -c 'import glob,json,os; repo=os.environ.get("REPOSITORY"); version=os.environ.get("VERSION"); names=[os.path.basename(x) for x in glob.glob("*") if os.path.basename(x) not in ("SHA256SUMS","latest.json")]; base="https://github.com/"+repo+"/releases/download/"+version+"/"; group=lambda suffixes:[{"name":n,"url":base+n} for n in names if n.lower().endswith(suffixes)]; json.dump({"version":version,"platforms":{"macos":group((".dmg",".app.tar.gz")),"windows":group((".msi",".exe",".zip")),"linux":group((".appimage",".deb",".rpm"))}},open("latest.json","w"),indent=2)'
          gh release upload "${VERSION}" SHA256SUMS latest.json --repo "${REPOSITORY}" --clobber
